[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wts-worker"
version = "0.1.0"
description = "Wireless Test System pull-based execution worker (testbed side)"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<0.29",
    "pytest>=8.0,<9.0",
]

[project.scripts]
wts-worker = "wts_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wts_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
