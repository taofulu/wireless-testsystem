[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wts-backend"
version = "0.1.0"
description = "Wireless Test System backend (FastAPI + SQLAlchemy)"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.15",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
