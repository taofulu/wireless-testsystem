name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: wts
          POSTGRES_PASSWORD: wts
          POSTGRES_DB: wts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 从零建库（PostgreSQL + Alembic）
        env:
          WTS_DATABASE_URL: postgresql+psycopg2://wts:wts@localhost:5432/wts_test
        run: alembic upgrade head
      - name: 运行测试（系统接缝，sqlite）
        run: pytest
      - name: uvicorn 真实启动冒烟
        env:
          # T3 起 lifespan 加载操作目录需连库；指向已迁移的测试库
          WTS_DATABASE_URL: postgresql+psycopg2://wts:wts@localhost:5432/wts_test
        run: |
          uvicorn app.main:app --port 8000 &
          UV_PID=$!
          for _ in $(seq 1 20); do
            python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)" 2>/dev/null && break
            sleep 0.5
          done
          python -c "import json, urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert body['status']=='ok', body"
          kill "$UV_PID"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: 运行测试
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查与构建
        run: npm run build
